name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'example/**'
      - 'analysis_options.yaml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'example/**'
      - 'analysis_options.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, Format, Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce 95% line coverage
        shell: bash
        run: |
          set -euo pipefail

          if ! coverage_summary=$(awk -F: -v minimum=95 '
            /^LF:/ { lines += $2 }
            /^LH:/ { covered += $2 }
            END {
              if (lines == 0) {
                print "Coverage report contains no coverable lines."
                exit 1
              }
              percentage = covered * 100 / lines
              printf "Line coverage: %.2f%% (%d/%d); required: %.2f%%\n", percentage, covered, lines, minimum
              if (covered * 100 < lines * minimum) exit 1
            }
          ' coverage/lcov.info); then
            echo "$coverage_summary"
            exit 1
          fi
          echo "$coverage_summary"

      - name: Run daylight-saving date regressions
        env:
          TZ: America/New_York
        run: flutter test test/src/calendar_date_utils_test.dart

      - name: Run skipped local-midnight regressions (Sao Paulo)
        env:
          TZ: America/Sao_Paulo
        run: flutter test test/src/calendar_date_utils_test.dart

      - name: Run skipped civil-day regressions (Apia)
        env:
          TZ: Pacific/Apia
        run: >-
          flutter test test/src/calendar_date_utils_test.dart
          test/src/calendar_month_layout_invariants_test.dart

      - name: Run skipped civil-day regressions (Kwajalein)
        env:
          TZ: Pacific/Kwajalein
        run: >-
          flutter test test/src/calendar_date_utils_test.dart
          test/src/calendar_month_layout_invariants_test.dart

      - name: Run example tests
        run: flutter test
        working-directory: example

      - name: Build Android example
        run: flutter build apk --debug
        working-directory: example

      - name: Configure Web example
        run: flutter create --platforms=web .
        working-directory: example

      - name: Build JavaScript Web example
        run: flutter build web --no-wasm-dry-run
        working-directory: example

      - name: Build Wasm Web example
        run: flutter build web --wasm
        working-directory: example

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
