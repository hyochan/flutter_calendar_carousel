name: Publish to pub.dev

# ----------------------------------------------------------------------------
# Fires automatically on any `v*` tag push and publishes to pub.dev via OIDC.
# No human-in-the-loop by design.
#
# ONE-TIME SETUP REQUIRED ON pub.dev:
#   1. pub.dev -> flutter_calendar_carousel -> Admin -> Automated publishing.
#   2. Enable "Publishing from GitHub Actions".
#   3. Repository: hyochan/flutter_calendar_carousel.
#   4. Tag pattern: v{{version}}.
#   5. Required environment: pub-dev (matches `environment:` below).
#
# Until the above is configured on pub.dev, `dart pub publish --force` will
# fail with an auth error on the first tag push — that's the signal to
# complete the pub.dev-side setup. See .claude/guides/05-deployment.md.
# ----------------------------------------------------------------------------

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pub-dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-dart requests the GitHub OIDC token and provisions the
      # short-lived pub.dev credential. The Flutter SDK's dart binary shadows
      # this action's binary below, but continues to use that credential.
      - name: Set up pub.dev authentication
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Dry-run publish
        run: flutter pub publish --dry-run

      - name: Publish to pub.dev
        run: dart pub publish --force
